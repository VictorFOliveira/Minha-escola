services:
  db:
    image: postgres:16
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minha_escola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio no perfil local-db}
      POSTGRES_DB: ${POSTGRES_DB:-minha_escola}
    volumes:
      - minha_escola_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-minha_escola} -d ${POSTGRES_DB:-minha_escola}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
    profiles: ["ops"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      - backend
    command: ["npm", "run", "db:migrate:deploy"]
    restart: "no"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8084}:3000"
    networks:
      - backend
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["standalone-edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN obrigatorio}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL obrigatorio}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
  edge:

volumes:
  minha_escola_db:
  caddy_data:
  caddy_config:
