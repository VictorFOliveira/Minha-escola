name: Scheduled jobs

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "37 4 * * *"
  workflow_dispatch:

jobs:
  communication:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Process communication queue
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 3 --retry-all-errors             -X POST             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/jobs/communications"

  daily:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run daily maintenance
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 3 --retry-all-errors             -X POST             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/jobs/daily"
