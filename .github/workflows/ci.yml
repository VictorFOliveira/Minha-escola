name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minha_escola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minha_escola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minha_escola?schema=public
      AUTH_SECRET: ci-auth-secret-minimum-32-characters-2026
      PLATFORM_AUTH_SECRET: ci-platform-secret-minimum-32-characters
      SECURITY_PEPPER: ci-security-pepper-minimum-32-characters
      CRON_SECRET: ci-cron-secret-minimum-32-characters
      APP_URL: http://127.0.0.1:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database schema
        shell: bash
        run: |
          if [ -f prisma/migrations/migration_lock.toml ]; then
            npm run db:migrate:deploy
          else
            npm run db:push
          fi

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          AUTH_SECRET: ci-auth-secret-minimum-32-characters-2026
          PLATFORM_AUTH_SECRET: ci-platform-secret-minimum-32-characters
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minha_escola?schema=public

      - name: Migration status
        if: hashFiles('prisma/migrations/migration_lock.toml') != ''
        run: npx prisma migrate status
