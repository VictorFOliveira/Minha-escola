name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minha_escola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minha_escola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minha_escola?schema=public
      AUTH_SECRET: ci-auth-secret-minimum-32-characters-2026
      PLATFORM_AUTH_SECRET: ci-platform-secret-minimum-32-characters
      SECURITY_PEPPER: ci-security-pepper-minimum-32-characters
      CRON_SECRET: ci-cron-secret-minimum-32-characters
      APP_URL: http://127.0.0.1:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify reproducible artifacts
        shell: bash
        run: |
          test -f package-lock.json
          test -f prisma/migrations/migration_lock.toml
          test -s prisma/migrations/00000000000000_baseline/migration.sql

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Test
        run: npm test

      - name: Performance database gate
        run: npm run test:performance

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          AUTH_SECRET: ci-auth-secret-minimum-32-characters-2026
          PLATFORM_AUTH_SECRET: ci-platform-secret-minimum-32-characters
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minha_escola?schema=public

      - name: Start compiled application
        shell: bash
        env:
          NODE_ENV: production
          AUTH_SECRET: ci-auth-secret-minimum-32-characters-2026
          PLATFORM_AUTH_SECRET: ci-platform-secret-minimum-32-characters
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minha_escola?schema=public
          APP_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm start > /tmp/minha-escola-next.log 2>&1 &
          echo $! > /tmp/minha-escola-next.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/minha-escola-next.log
          exit 1

      - name: HTTP end-to-end regression
        env:
          APP_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minha_escola?schema=public
        run: npm run test:e2e

      - name: Application log
        if: always()
        shell: bash
        run: tail -n 200 /tmp/minha-escola-next.log 2>/dev/null || true

      - name: Stop compiled application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/minha-escola-next.pid ]; then
            kill "$(cat /tmp/minha-escola-next.pid)" 2>/dev/null || true
          fi

      - name: Migration status
        run: npx prisma migrate status
