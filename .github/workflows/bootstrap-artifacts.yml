name: Bootstrap database artifacts

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'artifact-bootstrap'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/minha_escola

      - name: Generate baseline migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prisma/migrations/00000000000000_baseline
          mkdir -p prisma/migrations/00000000000000_baseline
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/00000000000000_baseline/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          test -s prisma/migrations/00000000000000_baseline/migration.sql

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations/
          if git diff --cached --quiet; then
            echo "Artifacts already up to date."
            exit 0
          fi
          git commit -m "chore: generate lockfile and baseline migration"
          if [ -n "${{ github.head_ref }}" ]; then
            git push origin HEAD:"${{ github.head_ref }}"
          else
            git push
          fi
